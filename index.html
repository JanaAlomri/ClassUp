<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassUp | إدارة أسهل، صف أكثر تفاعلًا</title><style>
:root{--primary:#3157d5;--primary2:#2447bd;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e6eaf2;--success:#1b9a68;--warning:#d98b16;--danger:#d94b5b;--shadow:0 10px 30px rgba(23,32,51,.07)}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.btn{background:var(--primary);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}.btn:hover{background:var(--primary2)}.btn.light{background:#eef2ff;color:var(--primary)}.btn.danger{background:#fff0f2;color:var(--danger)}.btn.gray{background:#f1f3f7;color:var(--text)}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--primary)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.landing{min-height:100vh;display:grid;place-items:center;padding:24px}.hero{max-width:900px;text-align:center}.logo{font-size:42px;font-weight:900;color:var(--primary);margin-bottom:10px}.hero h1{font-size:42px;margin:10px 0}.hero p{font-size:18px;color:var(--muted);line-height:1.8}.roles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:28px}.role{min-width:210px;padding:22px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;font-weight:800}.role span{display:block;font-size:35px;margin-bottom:10px}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{width:min(460px,100%)}.auth h2{margin-top:0}.auth-top{display:flex;gap:8px;margin-bottom:16px}.auth-top button{flex:1}.form-row{margin:12px 0}.label{display:block;font-weight:700;margin-bottom:7px}.hint{color:var(--muted);font-size:13px}.error{background:#fff0f2;color:var(--danger);padding:10px;border-radius:10px;margin:10px 0}.success{background:#edf9f4;color:var(--success);padding:10px;border-radius:10px;margin:10px 0}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#fff;border-left:1px solid var(--line);padding:20px;position:fixed;right:0;top:0;bottom:0;z-index:5}.brand{font-size:25px;font-weight:900;color:var(--primary);margin-bottom:25px}.nav{display:grid;gap:7px}.nav button{padding:12px;border-radius:10px;background:transparent;text-align:right;color:var(--text)}.nav button:hover,.nav button.active{background:#eef2ff;color:var(--primary);font-weight:700}.main{margin-right:250px;width:calc(100% - 250px);padding:24px}.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.topbar h2{margin:0}.menu{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat b{font-size:30px;display:block;margin:7px 0}.muted{color:var(--muted)}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:var(--primary);font-size:12px}.list{display:grid;gap:10px}.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.empty{text-align:center;color:var(--muted);padding:30px}.toast{position:fixed;left:20px;bottom:20px;background:#172033;color:#fff;padding:13px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}@media(max-width:850px){.sidebar{display:none;width:250px}.sidebar.open{display:block}.main{margin-right:0;width:100%;padding:16px}.menu{display:block}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.hero h1{font-size:30px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.logo{font-size:34px}}
</style></head><body>
<div id="landing" class="landing"><div class="hero"><div class="logo">ClassUp</div><h1>إدارة أسهل، صف أكثر تفاعلًا</h1><p>منصة تعليمية تساعد المعلم على إدارة الصف والطلاب والنقاط والواجبات، وتمنح الطالب تجربة تعليمية منظمة وتفاعلية.</p><div class="roles"><button class="role" onclick="openAuth('teacher','login')"><span>👩‍🏫</span>أنا معلم</button><button class="role" onclick="openAuth('student','login')"><span>🎓</span>أنا طالب</button></div></div></div>
<div id="authPage" class="auth-wrap hidden"><div class="auth card"><div class="auth-top"><button id="loginTab" class="btn" onclick="setAuthMode('login')">تسجيل الدخول</button><button id="registerTab" class="btn gray" onclick="setAuthMode('register')">إنشاء حساب</button></div><h2 id="authTitle">تسجيل الدخول</h2><p id="authDesc" class="muted"></p><div id="authError" class="error hidden"></div><div id="nameRow" class="form-row hidden"><label class="label">الاسم</label><input id="nameInput" placeholder="اكتب اسمك"></div><div class="form-row"><label class="label">البريد الإلكتروني</label><input id="emailInput" type="email" placeholder="example@email.com"></div><div class="form-row"><label class="label">كلمة المرور</label><input id="passwordInput" type="password" placeholder="6 أحرف أو أكثر"></div><div id="codeRow" class="form-row hidden"><label class="label">رمز الصف</label><input id="codeInput" placeholder="مثال: CU-1234"></div><button id="authBtn" class="btn" style="width:100%" onclick="submitAuth()">دخول</button><button class="btn gray" style="width:100%;margin-top:8px" onclick="showLanding()">رجوع</button><button id="forgotBtn" class="btn light" style="width:100%;margin-top:8px" onclick="forgotPassword()">نسيت كلمة المرور؟</button></div></div>
<div id="dashboard" class="app hidden"><aside id="sidebar" class="sidebar"></aside><main class="main"><div class="topbar"><div><button class="btn light menu" onclick="toggleSidebar()">☰</button> <span id="roleLabel" class="badge"></span><h2 id="pageTitle">الرئيسية</h2></div><button class="btn danger" onclick="logout()">تسجيل الخروج</button></div><div id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,getDocs,updateDoc,deleteDoc,increment}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyC8-WQSOQWAFVpePQ91DU8MpMOlwKMuf1k',authDomain:'classup-31356.firebaseapp.com',projectId:'classup-31356',storageBucket:'classup-31356.firebasestorage.app',messagingSenderId:'741172181176',appId:'1:741172181176:web:aa89605ae947f9393c9c4d',measurementId:'G-4NVTQDZ6CB'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const S={user:null,uid:null,role:null,name:'',email:'',classId:null,classes:[],students:[],assignments:[],challenges:[],rewards:[]};let authRole='teacher',authMode='login';
const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}function err(t){$('authError').textContent=t;$('authError').classList.remove('hidden')}function clearErr(){$('authError').classList.add('hidden')}
function showLanding(){$('landing').classList.remove('hidden');$('authPage').classList.add('hidden');$('dashboard').classList.add('hidden')}function openAuth(role,mode='login'){authRole=role;setAuthMode(mode);$('landing').classList.add('hidden');$('authPage').classList.remove('hidden');$('authDesc').textContent=role==='teacher'?'حساب المعلم لإدارة الصف والطلاب.':'حساب الطالب لمتابعة نقاطك وواجباتك.';$('emailInput').focus()}function setAuthMode(m){authMode=m;clearErr();$('authTitle').textContent=m==='login'?'تسجيل الدخول':'إنشاء حساب جديد';$('authBtn').textContent=m==='login'?'دخول':'إنشاء الحساب';$('nameRow').classList.toggle('hidden',m==='login');$('codeRow').classList.toggle('hidden',m==='login'||authRole==='teacher');$('forgotBtn').classList.toggle('hidden',m!=='login');$('loginTab').className=m==='login'?'btn':'btn gray';$('registerTab').className=m==='register'?'btn':'btn gray'}
async function submitAuth(){clearErr();const email=$('emailInput').value.trim().toLowerCase(),pass=$('passwordInput').value,name=$('nameInput').value.trim(),code=$('codeInput').value.trim().toUpperCase();if(!email||!pass)return err('اكتبي البريد وكلمة المرور.');try{if(authMode==='login'){await signInWithEmailAndPassword(auth,email,pass)}else{if(!name)return err('اكتبي الاسم.');if(pass.length<6)return err('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');let classData=null;if(authRole==='student'){if(!code)return err('رمز الصف مطلوب للطالب.');const c=await getDoc(doc(db,'classCodes',code));if(!c.exists())return err('رمز الصف غير صحيح.');classData=c.data()}const cred=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cred.user,{displayName:name});const u={name,email,role:authRole,createdAt:Date.now()};if(classData)u.classId=classData.classId;await setDoc(doc(db,'users',cred.user.uid),u);if(authRole==='student'){await setDoc(doc(db,'students',cred.user.uid),{uid:cred.user.uid,teacherId:classData.teacherId,classId:classData.classId,name,email,points:0,progress:0,badge:'🌟',createdAt:Date.now()})}toast('تم إنشاء الحساب بنجاح')} }catch(e){err(firebaseError(e))}}
function firebaseError(e){const c=e?.code||'';if(c.includes('email-already-in-use'))return'البريد الإلكتروني مستخدم مسبقًا.';if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return'البريد أو كلمة المرور غير صحيحة.';if(c.includes('weak-password'))return'كلمة المرور ضعيفة.';return e?.message||'حدث خطأ، حاولي مرة أخرى.'}
async function forgotPassword(){const email=$('emailInput').value.trim();if(!email)return err('اكتبي البريد الإلكتروني أولًا.');try{await sendPasswordResetEmail(auth,email);toast('تم إرسال رابط إعادة تعيين كلمة المرور.')}catch(e){err(firebaseError(e))}}
async function logout(){await signOut(auth);showLanding();toast('تم تسجيل الخروج')}
async function handleUser(u){
  if(!u){S.user=null;return showLanding()}
  try{
    S.user=u;S.uid=u.uid;
    let us=await getDoc(doc(db,'users',u.uid));
    if(!us.exists()){
      const st=await getDoc(doc(db,'students',u.uid));
      if(st.exists()){
        const sd=st.data();
        await setDoc(doc(db,'users',u.uid),{name:sd.name||u.displayName||'',email:sd.email||u.email||'',role:'student',classId:sd.classId||null,createdAt:Date.now()});
      }else{
        await setDoc(doc(db,'users',u.uid),{name:u.displayName||u.email?.split('@')[0]||'معلم',email:u.email||'',role:authRole||'teacher',createdAt:Date.now()});
      }
      us=await getDoc(doc(db,'users',u.uid));
    }
    const d=us.data();
    S.role=d.role;S.name=d.name||u.displayName||'';S.email=d.email||u.email||'';S.classId=d.classId||null;
    await loadData();showDashboard();
  }catch(e){console.error(e);err(firebaseError(e));showLanding()}
}
async function loadData(){S.classes=[];S.students=[];S.assignments=[];S.challenges=[];S.rewards=[];if(S.role==='teacher'){const q=query(collection(db,'classes'),where('teacherId','==',S.uid));S.classes=(await getDocs(q)).docs.map(x=>({id:x.id,...x.data()}));if(!S.classId||!S.classes.some(x=>x.id===S.classId))S.classId=S.classes[0]?.id||null}else if(S.classId){const p=await getDoc(doc(db,'students',S.uid));if(p.exists())S.students=[{id:p.id,...p.data()}]}await loadClassData()}
async function loadClassData(){if(!S.classId)return;const load=async(col)=>{const q=query(collection(db,col),where('classId','==',S.classId));return(await getDocs(q)).docs.map(x=>({id:x.id,...x.data()}))};if(S.role==='teacher'){S.students=await load('students');S.assignments=await load('assignments');S.challenges=await load('challenges');S.rewards=await load('rewards')}else{S.assignments=await load('assignments');S.challenges=await load('challenges');S.rewards=await load('rewards')}}
function showDashboard(){ $('landing').classList.add('hidden');$('authPage').classList.add('hidden');$('dashboard').classList.remove('hidden');$('roleLabel').textContent=S.role==='teacher'?'معلم':'طالب';renderSidebar();renderPage('home')}
function renderSidebar(){const items=S.role==='teacher'?[['home','الرئيسية','🏠'],['classes','الصفوف','🏫'],['students','الطلاب','👥'],['points','النقاط','⭐'],['challenges','التحديات','🎯'],['rewards','المكافآت','🎁'],['assignments','الواجبات','📝'],['reports','التقارير','📊'],['settings','الإعدادات','⚙️']]:[['home','الرئيسية','🏠'],['assignments','الواجبات','📝'],['challenges','التحديات','🎯'],['rewards','المكافآت','🎁'],['settings','الإعدادات','⚙️']];$('sidebar').innerHTML='<div class="brand">ClassUp</div><div class="nav">'+items.map(x=>`<button id="nav-${x[0]}" onclick="renderPage('${x[0]}');closeSidebar()">${x[2]} &nbsp; ${x[1]}</button>`).join('')+'</div>'}
function closeSidebar(){$('sidebar').classList.remove('open')}function toggleSidebar(){$('sidebar').classList.toggle('open')}
async function renderPage(page){$('pageTitle').textContent=({home:'الرئيسية',classes:'الصفوف',students:'الطلاب',points:'النقاط',challenges:'التحديات',rewards:'المكافآت',assignments:'الواجبات',reports:'التقارير',settings:'الإعدادات'})[page]||'الرئيسية';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$('nav-'+page)?.classList.add('active');if(S.role==='teacher')await loadClassData();if(page==='home')homePage();else if(page==='classes')classesPage();else if(page==='students')studentsPage();else if(page==='points')pointsPage();else if(page==='challenges')challengesPage();else if(page==='rewards')rewardsPage();else if(page==='assignments')assignmentsPage();else if(page==='reports')reportsPage();else settingsPage()}
function classSelect(){return S.classes.map(c=>`<option value="${c.id}" ${c.id===S.classId?'selected':''}>${esc(c.name)}</option>`).join('')}
function homePage(){if(S.role==='student'){const p=S.students[0]||{};$('content').innerHTML=`<div class="grid"><div class="card stat">النقاط<b>${p.points||0}</b><span class="muted">نقاطي الحالية</span></div><div class="card stat">التقدم<b>${p.progress||0}%</b><span class="muted">مستوى التقدم</span></div><div class="card stat">الواجبات<b>${S.assignments.length}</b><span class="muted">واجبات الصف</span></div><div class="card stat">المكافآت<b>${S.rewards.length}</b><span class="muted">مكافآت متاحة</span></div></div><div class="section card"><div class="section-head"><h3>مرحبًا ${esc(S.name)} 👋</h3><span>${p.badge||'🌟'}</span></div><p class="muted">تابع واجباتك وتحدياتك واجمع النقاط داخل ClassUp.</p></div>`;return}const total=S.students.reduce((a,s)=>a+(Number(s.points)||0),0),avg=S.students.length?Math.round(S.students.reduce((a,s)=>a+(Number(s.progress)||0),0)/S.students.length):0;$('content').innerHTML=`<div class="card" style="margin-bottom:15px"><div class="section-head"><div><h3>مرحبًا ${esc(S.name)} 👋</h3><span class="muted">${S.classId?(S.classes.find(c=>c.id===S.classId)?.name||'الصف'): 'أنشئي صفًا أولًا'}</span></div>${S.classId?`<select style="max-width:230px" onchange="changeClass(this.value)">${classSelect()}</select>`:''}</div></div><div class="grid"><div class="card stat">الطلاب<b>${S.students.length}</b></div><div class="card stat">مجموع النقاط<b>${total}</b></div><div class="card stat">متوسط التقدم<b>${avg}%</b></div><div class="card stat">الواجبات<b>${S.assignments.length}</b></div></div>`}
async function changeClass(id){S.classId=id;localStorage.setItem('classup_active_class',id);await renderPage('home')}
function classesPage(){$('content').innerHTML=`<div class="card"><h3>إنشاء صف جديد</h3><div class="form-grid"><input id="newClassName" placeholder="اسم الصف، مثال: ثالث ثانوي - أ"><button class="btn" onclick="createClass()">إنشاء الصف</button></div></div><div class="section list">${S.classes.length?S.classes.map(c=>`<div class="list-item"><div><b>${esc(c.name)}</b><div class="muted">رمز الانضمام: <strong>${c.joinCode}</strong></div></div><div class="actions"><button class="btn light" onclick="copyCode('${c.joinCode}')">نسخ الرمز</button><button class="btn gray" onclick="editClass('${c.id}')">تعديل</button><button class="btn danger" onclick="deleteClass('${c.id}')">حذف</button></div></div>`).join(''):'<div class="card empty">لا توجد صفوف بعد.</div>'}</div>`}
async function createClass(){const name=$('newClassName')?.value.trim();if(!name)return toast('اكتبي اسم الصف.');let code;do{code='CU-'+Math.floor(1000+Math.random()*9000)}while((await getDoc(doc(db,'classCodes',code))).exists());const c=await addDoc(collection(db,'classes'),{name,teacherId:S.uid,joinCode:code,createdAt:Date.now()});await setDoc(doc(db,'classCodes',code),{classId:c.id,name,teacherId:S.uid});S.classId=c.id;await loadData();toast('تم إنشاء الصف');renderPage('classes')}
async function editClass(id){const c=S.classes.find(x=>x.id===id);const name=prompt('اسم الصف:',c?.name||'');if(!name||!name.trim())return;await updateDoc(doc(db,'classes',id),{name:name.trim()});await updateDoc(doc(db,'classCodes',c.joinCode),{name:name.trim()});await loadData();toast('تم تعديل الصف');renderPage('classes')}
async function deleteClass(id){if(!confirm('حذف الصف؟ سيتم حذف بياناته المرتبطة أيضًا.'))return;const c=S.classes.find(x=>x.id===id);for(const col of ['students','assignments','challenges','rewards']){const q=query(collection(db,col),where('classId','==',id));for(const d of(await getDocs(q)).docs)await deleteDoc(d.ref)}if(c)await deleteDoc(doc(db,'classCodes',c.joinCode));await deleteDoc(doc(db,'classes',id));S.classId=null;await loadData();toast('تم حذف الصف');renderPage('classes')}
async function copyCode(code){await navigator.clipboard?.writeText(code);toast('تم نسخ رمز الصف: '+code)}
function studentsPage(){$('content').innerHTML=`<div class="card"><h3>إضافة طالب</h3><div class="form-grid"><input id="studentName" placeholder="اسم الطالب"><input id="studentEmail" placeholder="البريد الإلكتروني (اختياري)"><button class="btn" onclick="addStudent()">إضافة الطالب</button></div></div><div class="section card"><div class="table-wrap"><table class="table"><thead><tr><th>الطالب</th><th>النقاط</th><th>التقدم</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${S.students.length?S.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.points||0}</td><td>${s.progress||0}%</td><td>${s.uid?'مرتبط بحساب':'بدون حساب بعد'}</td><td><div class="actions"><button class="btn light" onclick="editStudent('${s.id}')">تعديل</button><button class="btn danger" onclick="deleteStudent('${s.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="5" class="empty">لا يوجد طلاب.</td></tr>`}</tbody></table></div></div>`}
async function addStudent(){if(!S.classId)return toast('أنشئي صفًا أولًا.');const name=$('studentName').value.trim(),email=$('studentEmail').value.trim();if(!name)return toast('اكتبي اسم الطالب.');await addDoc(collection(db,'students'),{teacherId:S.uid,classId:S.classId,name,email,points:0,progress:0,badge:'🌟',createdAt:Date.now()});toast('تمت إضافة الطالب');renderPage('students')}
async function editStudent(id){const s=S.students.find(x=>x.id===id);if(!s)return;const name=prompt('اسم الطالب:',s.name);if(name===null)return;const progress=prompt('نسبة التقدم (0-100):',s.progress||0);const p=Math.max(0,Math.min(100,Number(progress)||0));await updateDoc(doc(db,'students',id),{name:name.trim(),progress:p});toast('تم التعديل');renderPage('students')}
async function deleteStudent(id){if(!confirm('حذف الطالب؟'))return;await deleteDoc(doc(db,'students',id));toast('تم الحذف');renderPage('students')}
function pointsPage(){$('content').innerHTML=`<div class="card"><h3>إضافة نقاط</h3><div class="form-grid"><select id="pointStudent">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)} — ${s.points||0} نقطة</option>`).join('')}</select><input id="pointAmount" type="number" placeholder="عدد النقاط"><button class="btn" onclick="addPoints()">إضافة</button></div></div><div class="section card"><div class="list">${S.students.map(s=>`<div class="list-item"><b>${esc(s.name)}</b><strong>⭐ ${s.points||0}</strong></div>`).join('')||'<div class="empty">لا يوجد طلاب.</div>'}</div></div>`}
async function addPoints(){const id=$('pointStudent')?.value,n=Number($('pointAmount')?.value);if(!id||!n)return toast('اختاري طالبًا واكتبي عدد النقاط.');await updateDoc(doc(db,'students',id),{points:increment(n)});toast('تمت إضافة النقاط');renderPage('points')}
function challengesPage(){if(S.role==='student'){$('content').innerHTML=`<div class="list">${S.challenges.length?S.challenges.map(c=>`<div class="card"><h3>🎯 ${esc(c.name)}</h3><p class="muted">${esc(c.description||'تحدي جديد')}</p></div>`).join(''):'<div class="card empty">لا توجد تحديات حاليًا.</div>'}</div>`;return}$('content').innerHTML=`<div class="card"><h3>إضافة تحدي</h3><div class="form-grid"><input id="challengeName" placeholder="اسم التحدي"><input id="challengeDesc" placeholder="وصف التحدي"><button class="btn" onclick="addChallenge()">إضافة</button></div></div><div class="section list">${S.challenges.map(c=>`<div class="list-item"><div><b>🎯 ${esc(c.name)}</b><div class="muted">${esc(c.description||'')}</div></div><button class="btn danger" onclick="deleteItem('challenges','${c.id}')">حذف</button></div>`).join('')||'<div class="card empty">لا توجد تحديات.</div>'}</div>`}
async function addChallenge(){if(!S.classId)return toast('أنشئي صفًا أولًا.');const name=$('challengeName').value.trim(),description=$('challengeDesc').value.trim();if(!name)return toast('اكتبي اسم التحدي.');await addDoc(collection(db,'challenges'),{name,description,classId:S.classId,teacherId:S.uid,createdAt:Date.now()});toast('تمت إضافة التحدي');renderPage('challenges')}
function rewardsPage(){if(S.role==='student'){$('content').innerHTML=`<div class="list">${S.rewards.length?S.rewards.map(r=>`<div class="list-item"><div><b>🎁 ${esc(r.name)}</b><div class="muted">التكلفة: ${r.points} نقطة</div></div></div>`).join(''):'<div class="card empty">لا توجد مكافآت حاليًا.</div>'}</div>`;return}$('content').innerHTML=`<div class="card"><h3>إضافة مكافأة</h3><div class="form-grid"><input id="rewardName" placeholder="اسم المكافأة"><input id="rewardPoints" type="number" placeholder="عدد النقاط"><button class="btn" onclick="addReward()">إضافة</button></div></div><div class="section list">${S.rewards.map(r=>`<div class="list-item"><div><b>🎁 ${esc(r.name)}</b><div class="muted">${r.points} نقطة</div></div><button class="btn danger" onclick="deleteItem('rewards','${r.id}')">حذف</button></div>`).join('')||'<div class="card empty">لا توجد مكافآت.</div>'}</div>`}
async function addReward(){const name=$('rewardName').value.trim(),points=Number($('rewardPoints').value);if(!name||!points)return toast('اكتبي اسم المكافأة والنقاط.');await addDoc(collection(db,'rewards'),{name,points,classId:S.classId,teacherId:S.uid,createdAt:Date.now()});toast('تمت إضافة المكافأة');renderPage('rewards')}
async function deleteItem(col,id){if(!confirm('حذف العنصر؟'))return;await deleteDoc(doc(db,col,id));toast('تم الحذف');renderPage(col)}
function assignmentsPage(){if(S.role==='student'){$('content').innerHTML=`<div class="list">${S.assignments.length?S.assignments.map(a=>`<div class="card"><div class="section-head"><h3>📝 ${esc(a.title)}</h3><span class="badge">${esc(a.subject||'عام')}</span></div><p class="muted">موعد التسليم: ${esc(a.due||'غير محدد')}</p></div>`).join(''):'<div class="card empty">لا توجد واجبات حاليًا.</div>'}</div>`;return}$('content').innerHTML=`<div class="card"><h3>إضافة واجب</h3><div class="form-grid"><input id="assignmentTitle" placeholder="عنوان الواجب"><input id="assignmentSubject" placeholder="المادة"><input id="assignmentDue" type="date"><button class="btn" onclick="addAssignment()">إضافة</button></div></div><div class="section list">${S.assignments.map(a=>`<div class="list-item"><div><b>📝 ${esc(a.title)}</b><div class="muted">${esc(a.subject||'')} — ${esc(a.due||'')}</div></div><button class="btn danger" onclick="deleteItem('assignments','${a.id}')">حذف</button></div>`).join('')||'<div class="card empty">لا توجد واجبات.</div>'}</div>`}
async function addAssignment(){const title=$('assignmentTitle').value.trim(),subject=$('assignmentSubject').value.trim(),due=$('assignmentDue').value;if(!title)return toast('اكتبي عنوان الواجب.');await addDoc(collection(db,'assignments'),{title,subject,due,classId:S.classId,teacherId:S.uid,createdAt:Date.now()});toast('تمت إضافة الواجب');renderPage('assignments')}
function reportsPage(){const avg=S.students.length?Math.round(S.students.reduce((a,s)=>a+(Number(s.progress)||0),0)/S.students.length):0;const top=[...S.students].sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,5);$('content').innerHTML=`<div class="grid"><div class="card stat">متوسط التقدم<b>${avg}%</b></div><div class="card stat">عدد الطلاب<b>${S.students.length}</b></div><div class="card stat">الواجبات<b>${S.assignments.length}</b></div><div class="card stat">التحديات<b>${S.challenges.length}</b></div></div><div class="section card"><h3>أعلى الطلاب بالنقاط</h3><div class="list">${top.map((s,i)=>`<div class="list-item"><span>${i+1}. ${esc(s.name)}</span><b>⭐ ${s.points||0}</b></div>`).join('')||'<div class="empty">لا توجد بيانات.</div>'}</div></div>`}
function settingsPage(){$('content').innerHTML=`<div class="card"><h3>الإعدادات</h3><div class="form-row"><label class="label">الاسم</label><input id="settingsName" value="${esc(S.name)}"></div><div class="form-row"><label class="label">البريد الإلكتروني</label><input value="${esc(S.email)}" disabled></div><button class="btn" onclick="saveSettings()">حفظ التغييرات</button></div>`}
async function saveSettings(){const name=$('settingsName').value.trim();if(!name)return toast('اكتبي الاسم.');await updateDoc(doc(db,'users',S.uid),{name});await updateProfile(S.user,{displayName:name});S.name=name;toast('تم حفظ الإعدادات');renderPage('settings')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
onAuthStateChanged(auth,handleUser);
Object.assign(window,{showLanding,openAuth,setAuthMode,submitAuth,forgotPassword,logout,toggleSidebar,closeSidebar,renderPage,changeClass,createClass,editClass,deleteClass,copyCode,addStudent,editStudent,deleteStudent,addPoints,addChallenge,addReward,deleteItem,addAssignment,saveSettings});
</script></body></html>
