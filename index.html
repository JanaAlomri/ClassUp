<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClassUp | إدارة الصف بسهولة</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #3157d5;
        }

        .login {
            text-decoration: none;
            color: #3157d5;
            font-weight: bold;
        }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        .hero-content {
            max-width: 700px;
        }

        .badge {
            display: inline-block;
            background: #e9edff;
            color: #3157d5;
            padding: 9px 18px;
            border-radius: 30px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: bold;
        }

        h1 {
            font-size: 52px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        h1 span {
            color: #3157d5;
        }

        .description {
            font-size: 20px;
            color: #667085;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 16px 35px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .teacher {
            background: #3157d5;
            color: white;
        }

        .student {
            background: white;
            color: #3157d5;
            border: 2px solid #3157d5;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 55px;
        }

        .feature {
            background: white;
            padding: 18px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            color: #475467;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 17px;
            }

            .navbar {
                padding: 18px 5%;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">ClassUp</div>
        <a href="#" class="login">تسجيل الدخول</a>
    </nav>

    <main class="hero">

        <div class="hero-content">

            <div class="badge">
                🎓 منصة تعليمية تفاعلية
            </div>

            <h1>
                إدارة أسهل،<br>
                <span>صف أكثر تفاعلًا.</span>
            </h1>

            <p class="description">
                ClassUp يساعد المعلمين على إدارة الصف،
                متابعة الطلاب، تنظيم الواجبات،
                وتحفيز الطلاب بطريقة ممتعة وذكية.
            </p>

            <div class="buttons">
                <button class="teacher">
                    👩🏻‍🏫 أنا معلم
                </button>

                <button class="student">
                    👩🏻‍🎓 أنا طالب
                </button>
            </div>

            <div class="features">
                <div class="feature">⭐ النقاط</div>
                <div class="feature">🏆 الإنجازات</div>
                <div class="feature">📊 التقارير</div>
                <div class="feature">📚 الواجبات</div>
            </div>

        </div>

    </main>

</body>
</html>
